<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DST10 Performances Edit</title>
<meta name="theme-color" content="#07060b">
<style>
:root{--bg:#07060b;--bar:rgba(7,6,11,.92);--card:#13111c;--line:#262234;--tx:#f3f0fa;--mu:#9a93ad;--acc:#b06bff;--acc2:#ff4fd8;--onacc:#12041f;--ok:#35d07f;--warn:#ffb340;--field:#0d0b14;--r:6px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{margin:0;font-size:24px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{color:var(--mu);font-size:13px}
main{max-width:960px;margin:0 auto;padding:12px 16px 48px}

/* list */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.item{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;color:inherit;text-decoration:none}
.item:active{border-color:var(--acc)}
.thumb{position:relative;aspect-ratio:16/9;background:#000}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.num{position:absolute;left:6px;top:6px;background:var(--acc);color:var(--onacc);font-size:11px;font-weight:700;border-radius:3px;padding:1px 6px}
.dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.75);color:#fff;font-size:11px;border-radius:3px;padding:0 5px;font-variant-numeric:tabular-nums}
.info{min-width:0;padding:8px 10px 10px}
.info b{display:block;font-size:14px;font-weight:650;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;margin-top:4px;color:var(--mu)}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line)}
.st.ok{color:var(--ok)}.st.ok::before{background:var(--ok)}
.st.fix{color:var(--warn)}.st.fix::before{background:var(--warn)}

/* player view */
#view{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;overflow-x:hidden;display:none;-webkit-overflow-scrolling:touch}
#view.open{display:block}
.top{position:sticky;top:0;z-index:3;background:var(--bg)}
.vbar{position:relative;display:flex;align-items:center;justify-content:center;min-height:52px;padding:8px 56px;border-bottom:1px solid var(--line)}
#back{position:absolute;left:4px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:22px;line-height:1;padding:10px 12px;cursor:pointer}
.vbar h2{margin:0;font-size:17px;font-weight:750;letter-spacing:.02em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
video{width:100%;aspect-ratio:16/9;max-height:56vh;background:#000;display:block}
.wrap{max-width:960px;margin:0 auto}
.pn{display:flex;justify-content:space-between;gap:12px;padding:8px 16px;font-size:13px;border-bottom:1px solid var(--line)}
.pn a{color:var(--mu);text-decoration:none;max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn a:active{color:var(--acc)}
.pn a.off{visibility:hidden}
.pad{padding:14px 16px 48px}
.slide-l{animation:sl .22s ease-out}.slide-r{animation:sr .22s ease-out}
@keyframes sl{from{opacity:.3;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes sr{from{opacity:.3;transform:translateX(-40px)}to{opacity:1;transform:none}}
form{display:grid;gap:10px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,textarea{width:100%;background:var(--field);border:1px solid var(--line);color:var(--tx);border-radius:var(--r);padding:10px 12px;font:inherit;font-size:16px}
input:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
textarea{min-height:76px;resize:vertical}
.pick{padding:11px;border-radius:var(--r);border:1px solid var(--line);background:var(--field);font-weight:650;cursor:pointer}
.pick.ok.on{background:var(--ok);border-color:var(--ok);color:#04150b}
.pick.fix.on{background:var(--warn);border-color:var(--warn);color:#1d1200}
.lbl{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mu)}
.tsb{background:none;border:1px solid var(--line);color:var(--acc);border-radius:var(--r);padding:3px 10px;font-size:12px;cursor:pointer}
.submit{padding:12px;border:0;border-radius:var(--r);background:linear-gradient(90deg,var(--acc),var(--acc2));color:var(--onacc);font-weight:700;font-size:16px;cursor:pointer}
.submit:disabled{opacity:.5}
.msg{font-size:13px;min-height:1em;color:var(--mu)}
.fbh{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:22px 0 4px}
.fb{list-style:none;padding:0;margin:0}
.fb li{border-top:1px solid var(--line);padding:10px 0;font-size:14px}
.fb .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fb .who{font-weight:650}
.fb .st{margin:0}
.fb .when{margin-left:auto}
.fb .n{white-space:pre-wrap;margin-top:4px}
.when{color:var(--mu);font-size:12px;font-variant-numeric:tabular-nums}
.tc{display:inline-block;background:rgba(176,107,255,.16);color:var(--acc);border:0;border-radius:3px;padding:0 5px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer}
.pv{white-space:pre-wrap;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;margin-top:-4px}
.pv::before{content:"Preview";display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin-bottom:2px}
.banner{background:rgba(240,163,48,.12);border:1px solid rgba(240,163,48,.4);color:var(--warn);padding:10px 12px;border-radius:var(--r);font-size:13px;margin-bottom:10px}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>DST10</h1><span>Performances Edit Checking</span></div>
</header>
<main id="list"></main>

<section id="view" aria-modal="true">
  <div class="top">
    <div class="vbar">
      <button id="back" aria-label="Back to list">&larr;</button>
      <h2 id="vt"></h2>
    </div>
    <div class="wrap"><video id="vid" controls playsinline preload="metadata"></video></div>
    <div class="wrap pn"><a id="prev"></a><a id="next"></a></div>
  </div>
  <div class="wrap pad" id="body">
    <form id="form">
      <input id="nm" autocomplete="name" maxlength="60" placeholder="Your name" aria-label="Your name">
      <div class="r2">
        <button type="button" class="pick ok" data-s="Approved">Approve</button>
        <button type="button" class="pick fix" data-s="Needs correction">Revise</button>
      </div>
      <div class="lbl"><span>Notes</span><button type="button" class="tsb" id="ts">+ Add time</button></div>
      <textarea id="nt" maxlength="2000" placeholder="e.g. 1:23 wrong logo"></textarea>
      <div class="pv" id="pv" hidden></div>
      <button class="submit" id="sub">Submit</button>
      <div class="msg" id="msg"></div>
    </form>
    <div class="fbh">Feedback</div>
    <ul class="fb" id="fb"></ul>
  </div>
</section>

<script src="config.js?v=5"></script>
<script src="videos.js?v=5"></script>
<script>
const $=s=>document.querySelector(s);
let FB=[], cur=null, status='';
const fmt=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0');return h?h+':'+String(m).padStart(2,'0')+':'+x:m+':'+x};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label=s=>s==='Approved'?'Approved':'Revise';
function when(ts){const d=new Date(ts);if(isNaN(d))return'';
  return d.toLocaleDateString([], {month:'short',day:'numeric'})+' · '+d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}
// turn [1:23] / 1:23 in notes into tappable time chips that seek the video
function notesHtml(t){return esc(t).replace(/\[?\b(\d{1,2}):([0-5]\d)\b\]?/g,(m,a,b)=>`<button type="button" class="tc" data-t="${+a*60+ +b}">${a}:${b}</button>`)}
const fbFor=id=>FB.filter(f=>f.id===id);
function stateOf(id){
  // latest entry per person decides; any outstanding revise => fix
  const by={};fbFor(id).forEach(f=>by[String(f.name).trim().toLowerCase()]=f);
  const v=Object.values(by);if(!v.length)return{k:'none',t:'Not reviewed'};
  const fix=v.filter(f=>f.status!=='Approved');
  if(fix.length)return{k:'fix',t:'Revise · '+fix.map(f=>f.name).join(', ')};
  return{k:'ok',t:'Approved · '+v.map(f=>f.name).join(', ')};
}
function renderList(){
  let h=window.FEEDBACK_URL?'':'<div class="banner">Feedback storage not connected yet.</div>';
  h+='<div class="grid">'+VIDEOS.map((v,i)=>{const s=stateOf(v.id);
    return `<a class="item" href="#${v.id}"><div class="thumb"><img loading="lazy" src="t/${v.id}.jpg" alt=""><span class="num">${i+1}</span><span class="dur">${fmt(v.dur)}</span></div><div class="info"><b>${esc(v.title)}</b><span class="st ${s.k}">${esc(s.t)}</span></div></a>`}).join('')+'</div>';
  $('#list').innerHTML=h;
}
function renderFb(){
  const l=fbFor(cur.id).sort((a,b)=>new Date(b.ts)-new Date(a.ts));
  $('#fb').innerHTML=l.length?l.map(f=>`<li><div class="hd"><span class="who">${esc(f.name)}</span><span class="st ${f.status==='Approved'?'ok':'fix'}">${label(f.status)}</span><span class="when">${esc(when(f.ts))}</span></div>${f.notes?`<div class="n">${notesHtml(f.notes)}</div>`:''}</li>`).join(''):'<li class="when">No feedback yet.</li>';
}
function setStatus(s){status=s;document.querySelectorAll('.pick').forEach(b=>b.classList.toggle('on',b.dataset.s===s))}
let lastIdx=-1;
function open(id){
  const i=VIDEOS.findIndex(v=>v.id===id);if(i<0)return close();
  cur=VIDEOS[i];
  $('#vt').textContent=cur.title;
  const vid=$('#vid');vid.poster='t/'+cur.id+'.jpg';vid.src='v/'+cur.id+'.mp4';
  const p=VIDEOS[i-1],n=VIDEOS[i+1];
  $('#prev').textContent=p?'‹ '+p.title:'';$('#prev').href=p?'#'+p.id:'#';$('#prev').classList.toggle('off',!p);
  $('#next').textContent=n?n.title+' ›':'';$('#next').href=n?'#'+n.id:'#';$('#next').classList.toggle('off',!n);
  setStatus('');$('#nt').value='';$('#msg').textContent='';$('#pv').hidden=true;
  renderFb();
  const wasOpen=$('#view').classList.contains('open');
  if(wasOpen&&lastIdx>=0&&lastIdx!==i){const t=$('.top .wrap');const c=i>lastIdx?'slide-l':'slide-r';[t,$('#vt')].forEach(e=>{e.classList.remove('slide-l','slide-r');void e.offsetWidth;e.classList.add(c)})}
  lastIdx=i;
  $('#view').classList.add('open');$('#view').scrollTop=0;document.body.style.overflow='hidden';
}
function close(){const vid=$('#vid');vid.pause();vid.removeAttribute('src');vid.load();cur=null;lastIdx=-1;$('#view').classList.remove('open');document.body.style.overflow='';renderList()}
function route(){const id=location.hash.slice(1);id?open(id):close()}
function go(d){if(!cur)return;const i=VIDEOS.indexOf(cur)+d;if(VIDEOS[i])location.replace('#'+VIDEOS[i].id)}
async function load(){
  if(!window.FEEDBACK_URL)return;
  try{const r=await fetch(FEEDBACK_URL+'?t='+Date.now());FB=await r.json();}catch(e){console.warn(e)}
  cur?renderFb():renderList();
}

// swipe left/right anywhere on the video page (not on the video's control bar or form fields)
(function(){let x0,y0,ok;const v=$('#view');
  v.addEventListener('touchstart',e=>{const t=e.touches[0],el=e.target;ok=true;
    if(el.closest('input,textarea'))ok=false;
    if(el.tagName==='VIDEO'){const r=el.getBoundingClientRect();if(t.clientY>r.bottom-56)ok=false}
    x0=t.clientX;y0=t.clientY},{passive:true});
  v.addEventListener('touchend',e=>{if(!ok)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)>70&&Math.abs(dy)<Math.abs(dx)*.6)go(dx<0?1:-1)},{passive:true});
})();

$('#back').onclick=()=>{location.hash=''};
$('#prev').onclick=e=>{e.preventDefault();go(-1)};
$('#next').onclick=e=>{e.preventDefault();go(1)};
document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>setStatus(b.dataset.s));
$('#fb').onclick=e=>{const b=e.target.closest('.tc');if(!b)return;const v=$('#vid'),t=+b.dataset.t;
  const seek=()=>{v.currentTime=t;v.play().catch(()=>{})};
  v.readyState>=1?seek():v.addEventListener('loadedmetadata',seek,{once:true});
  $('#view').scrollTop=0};
$('#ts').onclick=()=>{const t=$('#nt');t.value+=(t.value&&!t.value.endsWith('\n')?'\n':'')+fmt($('#vid').currentTime)+' ';t.focus();preview()};
// live preview of notes with styled timestamps (shown only when a timestamp is present)
function preview(){const t=$('#nt').value,p=$('#pv'),has=/\b\d{1,2}:[0-5]\d\b/.test(t);p.hidden=!has;if(has)p.innerHTML=notesHtml(t)}
$('#nt').addEventListener('input',preview);
$('#pv').onclick=e=>{const b=e.target.closest('.tc');if(b){const v=$('#vid');v.currentTime=+b.dataset.t}};
try{$('#nm').value=localStorage.getItem('dst-name')||''}catch(e){}
$('#form').onsubmit=async e=>{
  e.preventDefault();const msg=$('#msg');
  const name=$('#nm').value.trim(),notes=$('#nt').value.trim();
  if(!name)return msg.textContent='Please enter your name.';
  if(!status)return msg.textContent='Choose Approve or Revise.';
  if(status!=='Approved'&&!notes)return msg.textContent='Please describe what to revise.';
  if(!window.FEEDBACK_URL)return msg.textContent='Feedback storage not connected yet.';
  try{localStorage.setItem('dst-name',name)}catch(e){}
  const entry={id:cur.id,video:cur.title,name,status,notes};
  $('#sub').disabled=true;msg.textContent='Sending…';
  try{
    const r=await fetch(FEEDBACK_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(entry)});
    const j=await r.json();if(!j.ok)throw new Error(j.error||'failed');
    FB.push({...entry,ts:new Date().toISOString()});
    msg.textContent='Saved. Thank you!';$('#nt').value='';$('#pv').hidden=true;setStatus('');renderFb();
  }catch(err){msg.textContent='Could not send. Check your connection and try again.'}
  $('#sub').disabled=false;
};
window.addEventListener('hashchange',route);
renderList();route();load();
</script>
</body>
</html>
